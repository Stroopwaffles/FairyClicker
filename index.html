<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache">
  <meta name="theme-color" content="#0b0b2b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Fairy Clicker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=3.15">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧚</text></svg>">
</head>
<body>
  <!-- Welcome screen -->
  <section id="screen-title" class="screen active" aria-label="Welcome">
    <div class="title-sky" aria-hidden="true"></div>
    <div class="title-moon" aria-hidden="true"></div>
    <div class="title-card">
      <div class="title-pair"><div id="title-fairy" class="title-fairy" aria-hidden="true"></div><div id="title-pet" class="title-pet" aria-hidden="true"></div></div>
      <h1 class="logo">Fairy Clicker</h1>
      <p class="tagline">Gather the gifts of a moonlit realm</p>
      <div id="title-moons" class="title-moons" hidden></div>
      <div id="away-card" class="away-card" hidden></div>
      <div class="title-buttons">
        <button id="btn-continue" class="btn primary big" hidden>Continue</button>
        <button id="btn-new" class="btn big">Begin</button>
      </div>
      <p class="title-foot">Version 3.15 · progress saves automatically on this device</p>
    </div>
  </section>

  <!-- Game screen -->
  <section id="screen-game" class="screen" aria-label="Game">
    <header class="topbar">
      <button id="btn-home" class="icon-btn" aria-label="Back to title">⌂</button>
      <button id="btn-avatar" class="avatar-btn" aria-label="Wardrobe"></button>
      <div id="res-bar" class="res-bar"></div>
      <button id="btn-moon" class="moon-btn" aria-label="Moon Shrine"></button>
      <button id="btn-mute" class="icon-btn" aria-label="Mute sound">🔊</button>
    </header>

    <div class="stage">
      <nav id="loc-tabs" class="loc-tabs" aria-label="Locations"></nav>
      <div id="scene-wrap" class="scene-wrap">
        <div id="scene" class="scene"></div>
        <div class="scene-caption">
          <div id="scene-name" class="scene-name"></div>
          <div id="scene-rate" class="scene-rate"></div>
        </div>
        <div id="event-fx" class="event-fx" aria-hidden="true"></div>
        <div id="tap-hint" class="tap-hint"></div>
        <div id="event-layer" class="event-layer"></div>
        <div id="hands" class="hands" aria-hidden="true"></div>
        <button id="my-fairy" class="my-fairy" aria-label="Your fairy: open the wardrobe" hidden></button>
        <button id="my-pet" class="my-pet" aria-label="Your familiar" hidden></button>
        <div id="pet-bubble" class="pet-bubble" aria-live="polite" hidden></div>
        <div id="streak" class="streak" hidden><span class="streak-label"></span><div class="streak-bar"><i></i></div></div>
        <button id="fairy" class="fairy" aria-label="Wandering fairy" hidden><span>🧚</span></button>
        <div id="event-banner" class="event-banner" aria-live="polite"></div>
        <div id="lock-overlay" class="lock-overlay" hidden></div>
        <div id="floaters" class="floaters" aria-hidden="true"></div>
      </div>
    </div>

    <aside class="panel">
      <div class="panel-tabs" role="tablist">
        <button class="ptab" data-tab="helpers" role="tab">Helpers</button>
        <button class="ptab" data-tab="upgrades" role="tab">Upgrades</button>
        <button class="ptab" data-tab="features" role="tab">Features</button>
        <button class="ptab" data-tab="workshop" role="tab">Workshop</button>
        <button class="ptab" data-tab="awards" role="tab">Awards</button>
        <button class="ptab" data-tab="settings" role="tab" aria-label="Settings">⚙</button>
      </div>
      <div id="panel-body" class="panel-body"></div>
    </aside>
  </section>

  <!-- Moon Shrine: prestige and permanent upgrades -->
  <section id="shrine" class="shrine" aria-label="Moon Shrine" hidden>
    <div class="shrine-sky" aria-hidden="true"></div>
    <header class="shrine-head">
      <h2>Moon Shrine</h2>
      <button id="btn-shrine-close" class="icon-btn" aria-label="Close">✕</button>
    </header>
    <div class="shrine-body">
      <div id="prestige-card" class="prestige-card"></div>
      <div id="shrine-paths" class="shrine-paths"></div>
    </div>
  </section>

  <!-- Wardrobe: customise your fairy -->
  <section id="wardrobe" class="wardrobe" aria-label="Wardrobe" hidden>
    <div class="shrine-sky" aria-hidden="true"></div>
    <header class="shrine-head">
      <div><h2 id="wd-title">Wardrobe</h2><p id="wd-sub" class="wd-sub"></p></div>
      <button id="btn-wd-done" class="btn primary">Done</button>
    </header>
    <div class="wd-body">
      <div class="wd-preview">
        <div id="wd-fairy" class="wd-fairy"></div>
        <div id="wd-bonus" class="wd-bonus"></div>
        <button id="btn-wd-random" class="btn">🎲 Surprise me</button>
      </div>
      <div class="wd-options">
        <div class="seg wd-tabs" role="tablist">
          <button data-wtab="body" class="on">🧚 Body</button>
          <button data-wtab="paint">🎨 Face paint</button>
          <button data-wtab="clothes">👗 Clothes</button>
          <button data-wtab="pets">🐾 Familiars</button>
        </div>
        <div id="wd-list" class="wd-list"></div>
      </div>
    </div>
  </section>

  <!-- Finale -->
  <section id="finale" class="finale" aria-label="The realm is restored" hidden>
    <div class="finale-sky"></div>
    <div class="finale-stars"></div>
    <div class="finale-moon"></div>
    <div class="finale-land"></div>
    <div class="finale-text" id="finale-text"></div>
  </section>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="modal" class="modal" hidden></div>

  <!-- Release stamp (tools/stamp-version.mjs): makes browsers fetch fresh files after an update -->
  <script>window.FC_V = '?v=3.15';</script>
  <script type="module" src="js/main.js?v=3.15"></script>
</body>
</html>
